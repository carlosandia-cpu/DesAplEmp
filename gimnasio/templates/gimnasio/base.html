<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Gimnasio{% endblock %}</title>
    <style>
        :root {
            --bg: #f3f4f6; --card: #ffffff; --text: #1f2937; --muted: #6b7280;
            --nav: #111827; --accent: #f97316; --accent-dark: #ea580c;
            --border: #e5e7eb; --danger: #dc2626;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; flex-direction: column;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.5;
        }
        a { color: var(--accent-dark); }

        /* Barra de navegación */
        header { background: var(--nav); }
        .navbar {
            max-width: 1000px; margin: 0 auto; padding: 0 20px;
            display: flex; align-items: center; flex-wrap: wrap; gap: 24px;
        }
        .brand { color: #fff; font-weight: 700; font-size: 1.15rem; padding: 16px 0; text-decoration: none; }
        .brand span { color: var(--accent); }
        nav { display: flex; flex-wrap: wrap; }
        nav a {
            color: #d1d5db; text-decoration: none; padding: 18px 14px;
            font-size: .95rem; border-bottom: 3px solid transparent;
        }
        nav a:hover { color: #fff; }
        nav a.active { color: #fff; border-bottom-color: var(--accent); }

        /* Contenido */
        main { flex: 1; width: 100%; max-width: 1000px; margin: 28px auto; padding: 0 20px; }
        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.06); overflow-x: auto;
        }
        h1 { font-size: 1.6rem; margin: 0 0 16px; }
        h2 { font-size: 1.15rem; margin: 24px 0 12px; }
        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
        }
        .page-header h1 { margin: 0; }

        /* Tablas */
        table { width: 100%; border-collapse: collapse; font-size: .95rem; }
        th {
            background: #f9fafb; text-align: left; color: var(--muted);
            font-size: .8rem; text-transform: uppercase; letter-spacing: .04em;
        }
        th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); }
        tr:hover td { background: #fff7ed; }

        /* Botones */
        .btn {
            display: inline-block; padding: 9px 16px; border: 0; border-radius: 8px;
            background: var(--accent); color: #fff; font: inherit; font-weight: 600;
            text-decoration: none; cursor: pointer;
        }
        .btn:hover { background: var(--accent-dark); }
        .btn-secondary { background: #e5e7eb; color: #374151; }
        .btn-secondary:hover { background: #d1d5db; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #b91c1c; }

        /* Botones pequeños de acciones */
        .btn-sm { padding: 5px 10px; font-size: .85rem; }
        .acciones { white-space: nowrap; }
        .acciones .btn { margin-right: 4px; }

        /* Página de detalle */
        .info { display: grid; grid-template-columns: 180px 1fr; gap: 6px 16px; margin: 0 0 8px; }
        .info dt { color: var(--muted); font-weight: 600; }
        .info dd { margin: 0; }
        .section-head { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; }
        .section-head h2 { margin: 0; }
        .muted { color: var(--muted); }

        /* Formularios */
        form.form { max-width: 520px; }
        form p { margin: 0 0 16px; }
        form label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
        form input[type=text], form input[type=email], form input[type=number],
        form input[type=date], form input[type=datetime-local], form input[type=time],
        form select, form textarea {
            width: 100%; padding: 10px 12px; border: 1px solid #d1d5db;
            border-radius: 8px; font: inherit; background: #fff;
        }
        form input:focus, form select:focus, form textarea:focus {
            outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(249,115,22,.2);
        }
        .errorlist { list-style: none; margin: 0 0 6px; padding: 0; color: var(--danger); font-size: .85rem; }
        .helptext { display: block; color: var(--muted); font-size: .8rem; margin-top: 4px; }

        footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <a class="brand" href="{% url 'lista_clientes' %}">Gym<span>Manager</span></a>
            <nav>
                <a href="{% url 'lista_clientes' %}" {% if request.resolver_match.url_name == 'lista_clientes' %}class="active"{% endif %}>Clientes</a>
                <a href="{% url 'lista_clases' %}" {% if request.resolver_match.url_name == 'lista_clases' %}class="active"{% endif %}>Clases</a>
                <a href="{% url 'lista_entrenadores' %}" {% if request.resolver_match.url_name == 'lista_entrenadores' %}class="active"{% endif %}>Entrenadores</a>
                <a href="{% url 'lista_inscripciones' %}" {% if request.resolver_match.url_name == 'lista_inscripciones' %}class="active"{% endif %}>Inscripciones</a>
                <a href="{% url 'lista_membresias' %}" {% if request.resolver_match.url_name == 'lista_membresias' %}class="active"{% endif %}>Membresías</a>
                <a href="{% url 'lista_pagos' %}" {% if request.resolver_match.url_name == 'lista_pagos' %}class="active"{% endif %}>Pagos</a>
                <a href="{% url 'reporte' %}" {% if request.resolver_match.url_name == 'reporte' %}class="active"{% endif %}>Reporte</a>
                <a href="{% url 'reporte_pagos_clases' %}" {% if request.resolver_match.url_name == 'reporte_pagos_clases' %}class="active"{% endif %}>Reporte pagos</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="card">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer>
        <p>Sistema de gestión del gimnasio</p>
    </footer>

</body>
</html>
