<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar</title>
</head>
<body>

    <h1>Confirmar eliminación</h1>

    <p>
        ¿Está seguro de eliminar el {{ tipo }}:
        <strong>{{ objeto }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>

    <br>

    <a href="{% url 'lista_clientes' %}">Cancelar</a>

</body>
</html>
