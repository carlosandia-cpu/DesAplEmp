<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clases</title>
</head>
<body>

<h1>Clases registradas</h1>

<a href="{% url 'crear_clase' %}">Registrar nueva clase</a>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Horario</th>
        <th>Entrenador</th>
    </tr>

    {% for clase in clases %}
    <tr>
        <td>{{ clase.id }}</td>
        <td>{{ clase.nombre }}</td>
        <td>{{ clase.horario }}</td>
        <td>{{ clase.entrenador }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="4">No hay clases registradas.</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
